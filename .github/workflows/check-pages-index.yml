name: Check course index after Pages
on: deployment_status
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.repository == 'Dongqiyu829/Dongqiyu829.github.io' &&
      github.event.deployment.environment == 'github-pages' &&
      github.event.deployment.ref == 'main' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url == 'https://dongqiyu829.github.io/'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/knowledge/
      - name: Build checked index and record the release fingerprint
        run: |
          set -eu
          python3 .github/knowledge/pages_event_build.py --event-file "$GITHUB_EVENT_PATH" --bundle-out "$RUNNER_TEMP/pages-index-candidate" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the verified candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pages-index-candidate/READY
            ${{ runner.temp }}/pages-index-candidate/index.json
            ${{ runner.temp }}/pages-index-candidate/manifest.json
            ${{ runner.temp }}/pages-index-candidate/receipt.json
          if-no-files-found: error
          retention-days: 3
