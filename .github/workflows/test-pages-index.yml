name: Test candidate index export
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/knowledge/**'
      - '.github/workflows/*pages-index.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/knowledge/
      - name: Test the handoff with in-memory Pages responses
        run: python3 -B -m unittest discover -v -s .github/knowledge -p 'test_*.py'
