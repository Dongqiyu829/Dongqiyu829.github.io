<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Layout harness</title></head>
<body>
  <iframe id="mobile" title="Mobile lesson layout" src="../index.html" style="width:390px;height:844px;border:0"></iframe>
  <output id="result">pending</output>
  <script>
    document.getElementById("mobile").addEventListener("load", function () {
      const lesson = this.contentDocument;
      const doc = lesson.documentElement;
      lesson.querySelector('[data-poly="positive"]').click();
      const derivativePass = lesson.querySelector("[data-derivative-result]").textContent.includes("−24");
      const slider = lesson.querySelector("[data-k-slider]");
      slider.value = "8";
      slider.dispatchEvent(new Event("input", { bubbles: true }));
      const correctionPass = lesson.querySelector("[data-total-change]").textContent === "0";
      const next = lesson.querySelector("[data-step-next]");
      for (let i = 0; i < 9; i += 1) next.click();
      const endPass = lesson.querySelector("[data-step-count]").textContent.includes("5 / 5");
      lesson.querySelector("[data-step-reset]").click();
      const resetPass = lesson.querySelector("[data-step-count]").textContent.includes("1 / 5");
      lesson.querySelector('[data-quiz] [data-answer="correct"]').click();
      const quizPass = lesson.querySelector('[data-quiz] [data-feedback]').dataset.result === "correct";
      const keyboardTarget = lesson.querySelector('[data-poly="negative"]');
      keyboardTarget.focus();
      const focusPass = lesson.activeElement === keyboardTarget;
      const result = document.getElementById("result");
      result.textContent = JSON.stringify({
        clientWidth: doc.clientWidth,
        scrollWidth: doc.scrollWidth,
        noHorizontalOverflow: doc.scrollWidth <= doc.clientWidth,
        derivativePass,
        correctionPass,
        endPass,
        resetPass,
        quizPass,
        focusPass
      });
      result.setAttribute("data-ready", "true");
    });
  </script>
</body>
</html>
